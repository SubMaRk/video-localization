syntax = "proto3";

package videolocalization.contracts;

option csharp_namespace = "VideoLocalization.Contracts";

message OperationDescriptor {
  string operation_id = 1;
  string name = 2;
  string version = 3;
}

message CanonicalTime {
  int64 numerator = 1;
  uint32 scale = 2;
}

message WorkerEnvelope {
  string envelope_id = 1;
  string operation_id = 2;
  string source_profile = 3;
  CanonicalTime duration = 4;
}

message ProbeRequest {
  string request_id = 1;
  string source_path = 2;
  string output_directory = 3;
}

message ProbeResponse {
  string request_id = 1;
  bool accepted = 2;
  string message = 3;
}

service WorkerContract {
  rpc Probe(ProbeRequest) returns (ProbeResponse);
}
